name: Release

# 0.6.1 was the last release with a macOS x64 binary: that leg cross-compiled on an arm64 runner and ran its
# PGO training, determinism diff and smoke test under Rosetta 2, and it left the matrix after 0.6.1.
# scripts/install.sh tells an Intel Mac so, and test/releaseinstallcheck.sh (H7) refuses a macOS x64 leg here.
#
# Builds codecortex for macOS arm64 + Linux x64/arm64 (tarballs) and Windows x64 (zip, job build-windows) on every
# `vX.Y.Z` tag push and attaches the four assets to a GitHub Release. UNTESTED UNTIL THE FIRST REAL TAG PUSH:
# this file is statically valid (see test/portablebuildcheck.sh's sibling validation note and the workflow
# README pointer below) but has never actually run — GitHub Actions itself cannot be executed from this
# dev environment. Review the FIRST run's logs closely before trusting `scripts/install.sh` against it.
#
# Every leg configures WITHOUT -DCODECORTEX_NATIVE=ON on purpose: a release binary must run on any machine of
# its target arch, not just the exact CPU that happened to build it (see cmake/PortableFlags.cmake — the
# portable default keys on the TARGET arch: generic Apple Silicon tuning for macos-arm64, the x86-64-v3
# floor for linux-x64, and no host-specific flag anywhere).

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re-)build and release (workflow_dispatch testing only)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-26 # Apple Silicon (arm64) hosted runner; macos-14, which built this leg through 0.6.1, retires 2026-11-02
            asset_arch: arm64
            asset_os: macos
            pgo: true
            # Xcode 26.6 (17F113, Apple clang 21.0.0), the macos-26 image default. Through 0.6.1 this leg pinned Xcode
            # 16.2, whose AppleClang 16 is LLVM 17: its loop vectorizer ignores ASSUME_NO_ALIAS's separate-storage
            # promise (llvm/llvm-project#64666, fixed in LLVM 18) and keeps every runtime overlap check. Pinned so an
            # image bump cannot change the compiler under a release, and ci.yml's macOS legs test this same Xcode.
            developer_dir: /Applications/Xcode_26.6.app/Contents/Developer
            # The minimum macOS, PINNED. With no deployment target clang takes the lower of the runner's macOS and the
            # SDK default: 14.0 on macos-14 (v0.6.1's binary reads `minos 14.0`) but 26.x here, so the runner move alone
            # would drop every macOS 14 and 15 user. 14.0 is the std::print floor src/infra/emit.h names.
            # test/portablebuildcheck.sh #2i holds this runner, Xcode and minimum together with ci.yml's.
            deployment_target: "14.0"
          - name: linux-x64
            os: ubuntu-24.04
            # AlmaLinux-8-based manylinux container (glibc 2.28) with Red Hat gcc-toolset: newer
            # libstdc++ symbols are linked statically (the devtoolset model), so ONE binary runs on
            # RHEL/Alma/Rocky 8+, CentOS Stream, Fedora, Ubuntu 20.04+, Debian 11+. Built on stock
            # ubuntu-24.04 instead, the binary needs GLIBCXX_3.4.31 and dies on RHEL 9 (verified).
            container: quay.io/pypa/manylinux_2_28_x86_64
            asset_arch: x64
            asset_os: linux
          - name: linux-arm64
            os: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            asset_arch: arm64
            asset_os: linux
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container || '' }}
    # The macOS leg names its Xcode (matrix.developer_dir): Xcode 26.6, whose libc++ still defines __cpp_lib_print at
    # the pinned macOS 14.0 deployment target — the std::print floor ci.yml holds. Empty on the container legs
    # (gcc-toolset-14 already has it).
    env:
      DEVELOPER_DIR: ${{ matrix.developer_dir || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling (Linux)
        if: runner.os == 'Linux'
        run: |
          # manylinux/EL containers use dnf (libxml2 ships xmllint); the bare Ubuntu runner used apt
          if command -v dnf >/dev/null 2>&1; then
            dnf install -y libxml2
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libxml2-utils
          fi

      # The leg's pinned minimum macOS (matrix.deployment_target — see the macos-arm64 entry), exported so both of
      # pgobuild's configures and every clang invocation see it. A macOS leg without the key FAILS here instead of
      # building at whatever the runner's macOS implies. The Linux legs skip the step and never see the variable.
      - name: Pin the macOS deployment target
        if: runner.os == 'macOS'
        run: |
          if [ -z '${{ matrix.deployment_target }}' ]; then
            echo "release: macOS leg ${{ matrix.name }} sets no deployment_target, so it would ship at the runner's macOS" >&2
            exit 1
          fi
          echo "MACOSX_DEPLOYMENT_TARGET=${{ matrix.deployment_target }}" >> "$GITHUB_ENV"

      # PGO needs one toolchain end to end: the instrumented binary's profile runtime writes a .profraw version that
      # only the same LLVM's llvm-profdata merges and its clang reads. Both resolve through DEVELOPER_DIR; this step
      # records them for the log and fails when DEVELOPER_DIR is empty or either tool lives outside the pinned Xcode.
      # Both sides are compared as physical paths (pwd -P), so a symlinked Xcode neither passes nor fails by spelling.
      - name: Record the Xcode, compiler and llvm-profdata this leg builds with
        if: runner.os == 'macOS'
        run: |
          if [ -z "$DEVELOPER_DIR" ]; then
            echo "release: macOS leg ${{ matrix.name }} has no DEVELOPER_DIR, so the image's default Xcode would build it" >&2
            exit 1
          fi
          devDir="$( cd "$DEVELOPER_DIR" && pwd -P )" || { echo "release: DEVELOPER_DIR=$DEVELOPER_DIR is not a directory" >&2; exit 1; }
          xcodebuild -version
          c++ --version
          for tool in clang++ llvm-profdata; do
            path="$( xcrun --find "$tool" )" || { echo "release: xcrun cannot find $tool under DEVELOPER_DIR=$DEVELOPER_DIR" >&2; exit 1; }
            toolDir="$( cd "$( dirname "$path" )" && pwd -P )" || { echo "release: cannot resolve the directory of $tool at $path" >&2; exit 1; }
            path="$toolDir/${path##*/}"
            echo "$tool: $path"
            case "$path" in
              "$devDir"/*) ;;
              *) echo "release: $tool resolves to $path, outside DEVELOPER_DIR=$DEVELOPER_DIR ($devDir)" >&2; exit 1 ;;
            esac
          done

      - name: Configure (portable — no CODECORTEX_NATIVE, this binary ships to other machines)
        if: ${{ !matrix.pgo }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        if: ${{ !matrix.pgo }}
        run: cmake --build build -j --target codecortex

      # PGO for the shipped binary (the macOS leg only): scripts/pgobuild.sh is the same one-command
      # instrument -> train -> merge -> optimize flow a dev runs, trained on this checkout (the
      # script's own mixed workload). The Linux legs deliberately STAY LTO-only: their manylinux
      # gcc-toolset is load-bearing for the RHEL static-libstdc++ compat model, and CMake's PGO arm
      # refuses GCC (its -fprofile-* is the incompatible .gcda flavour) — moving Linux to clang is a
      # separate toolchain decision, not a rider on this step. Package/smoke read build/codecortex on
      # every leg, so the optimized binary is staged there — a plain file copy; what CMakeLists
      # refuses is CONFIGURING a PGO tree named build/, which this is not.
      - name: Build (profile-guided — instrument, train, merge, optimize)
        if: ${{ matrix.pgo }}
        run: |
          bash scripts/pgobuild.sh --cmake-extra -DCMAKE_BUILD_TYPE=Release
          mkdir -p build
          cp build_pgo/codecortex build/codecortex

      # Determinism is a contract and PGO is an optimizer change — the exact class the contract
      # guards against. Two runs must be byte-identical before this binary may ship.
      - name: PGO determinism check
        if: ${{ matrix.pgo }}
        run: |
          ./build/codecortex test/fixture --no-cache > a.xml
          ./build/codecortex test/fixture --no-cache > b.xml
          diff a.xml b.xml

      # The shipped binary must be the std::print arm on every leg (src/infra/emit.h): read off the binary,
      # after PGO staging on the macOS leg, so a fallback could never ship unnoticed.
      - name: The emitter the shipped binary compiled in is std::print
        run: |
          ./build/codecortex --version
          ./build/codecortex --version | grep -q 'emit=std::print'

      # The deployment-target pin, read off the shipped binary rather than trusted from the environment. The comparison
      # is an exact string match, so a missing or unreadable LC_BUILD_VERSION, two of them, or any other minimum fails.
      - name: The shipped binary's minimum macOS is the pinned one
        if: runner.os == 'macOS'
        run: |
          minos="$( otool -l build/codecortex | awk '$1 == "minos" { print $2 }' )"
          echo "build/codecortex: minos '$minos', pinned '${{ matrix.deployment_target }}'"
          if [ -z "$minos" ] || [ "$minos" != '${{ matrix.deployment_target }}' ]; then
            echo "release: the shipped binary's minimum macOS '$minos' is not the pinned '${{ matrix.deployment_target }}'" >&2
            exit 1
          fi

      - name: Smoke-test the freshly built binary
        run: |
          ./build/codecortex --version
          ./build/codecortex test/fixture --no-cache | xmllint --noout -

      - name: Package
        id: package
        run: |
          releaseTag="${{ inputs.tag || github.ref_name }}"
          version="$( ./build/codecortex --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 )"
          if [ "v${version}" != "$releaseTag" ]; then
            echo "release: binary version v${version} does not match release tag ${releaseTag}" >&2
            exit 1
          fi
          asset="codecortex-${version}-${{ matrix.asset_os }}-${{ matrix.asset_arch }}"
          mkdir -p "dist/${asset}"
          cp build/codecortex "dist/${asset}/codecortex"
          cp README.md LICENSE "dist/${asset}/" 2>/dev/null || cp README.md "dist/${asset}/"
          # skills/ is the payload that teaches an agent WHEN to reach for codecortex (18 codecortex-*/ dirs +
          # skills/install.sh, which symlinks from its OWN location — so it must travel with the tarball,
          # not just live in the repo checkout). scripts/install.sh stages this subtree straight into
          # $prefix/share/codecortex/skills; asset names and the top-level codecortex/README.md/LICENSE layout
          # are unchanged, this is purely additive.
          # no trailing slash on the glob: BSD cp (macOS runners) with a trailing slash copies each
          # source dir's CONTENTS into the destination (flattening/overwriting same-named files like
          # SKILL.md across skills) instead of copying the directory itself — verified live on this repo.
          mkdir -p "dist/${asset}/skills"
          cp -R skills/codecortex-* "dist/${asset}/skills/"
          cp skills/install.sh "dist/${asset}/skills/"
          # The opt-in agent hooks are a sibling of skills/ because skills/install.sh resolves them via
          # ../hooks. Package both the shared nudge and the Codex output adapter; omitting this subtree
          # leaves every prebuilt user's advertised --hook command pointing at a nonexistent file.
          cp -R hooks "dist/${asset}/hooks"
          # The dashboard. Before this line no release asset carried ui/, so every prebuilt install served
          # "UI asset unavailable" (src/ui/server.cpp looks for <prefix>/share/codecortex/ui); scripts/install.sh
          # stages this subtree there.
          cp -R ui "dist/${asset}/ui"
          mkdir -p "dist/${asset}/scripts"
          cp scripts/onboard-codex.sh "dist/${asset}/scripts/onboard-codex.sh"
          chmod +x "dist/${asset}/scripts/onboard-codex.sh"
          tar -C dist -czf "dist/${asset}.tar.gz" "${asset}"
          # basename inside the checksum file — `shasum -a 256 "dist/..."` bakes the dist/ prefix into
          # the published .sha256, which breaks `shasum -c` beside the downloaded pair (and therefore
          # scripts/install.sh's verification step, which checks exactly that way). sha256sum fallback:
          # the manylinux containers ship coreutils but not perl's shasum; both emit "HASH  NAME".
          if command -v shasum >/dev/null 2>&1; then
            ( cd dist && shasum -a 256 "${asset}.tar.gz" > "${asset}.tar.gz.sha256" )
          else
            ( cd dist && sha256sum "${asset}.tar.gz" > "${asset}.tar.gz.sha256" )
          fi
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"

      # One-click Claude Desktop extension for Mac (Claude desktop ships for macOS and Windows only, so the Linux
      # legs build none). Same builder as the Windows job.
      - name: Claude Desktop extension (.mcpb, macOS)
        if: runner.os == 'macOS'
        run: |
          python3 -m pip install --quiet --break-system-packages jsonschema 2>/dev/null || python3 -m pip install --quiet jsonschema
          asset="${{ steps.package.outputs.asset }}"
          version="$( ./build/codecortex --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 )"
          python3 scripts/build_mcpb.py --binary build/codecortex --ui ui --skills skills --hooks hooks \
            --version "$version" --platform darwin --out "dist/${asset}.mcpb"
          ( cd dist && shasum -a 256 "${asset}.mcpb" > "${asset}.mcpb.sha256" )
          # Unpacked-extension download for Mac, matching the Windows zip: when Claude Desktop's Install button
          # stays grey, users pick this folder in Settings > Extensions > Advanced > Install unpacked extension.
          # It is the .mcpb's own contents (manifest.json at the root), so both installs are identical.
          ext="${asset}-extension"
          rm -rf "dist/${ext}" && mkdir -p "dist/${ext}"
          unzip -q "dist/${asset}.mcpb" -d "dist/${ext}"
          test -f "dist/${ext}/manifest.json" || { echo "manifest.json missing from the .mcpb" >&2; exit 1; }
          find "dist/${ext}" -type f -name codecortex -exec chmod +x {} +
          ( cd dist && ditto -c -k --keepParent "${ext}" "${ext}.zip" && shasum -a 256 "${ext}.zip" > "${ext}.zip.sha256" )

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.asset }}
          path: |
            dist/${{ steps.package.outputs.asset }}.tar.gz
            dist/${{ steps.package.outputs.asset }}.tar.gz.sha256
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: ${{ steps.package.outputs.asset }}-mcpb
          path: |
            dist/${{ steps.package.outputs.asset }}.mcpb
            dist/${{ steps.package.outputs.asset }}.mcpb.sha256
            dist/${{ steps.package.outputs.asset }}-extension.zip
            dist/${{ steps.package.outputs.asset }}-extension.zip.sha256
          if-no-files-found: error

  # ─── windows-x64: the first prebuilt Windows download ──────────────────────────────────────────────────
  # Non-technical users cannot compile C++23, and before this job no Windows asset existed at all, so "install
  # CodeCortex" on Windows meant WSL + cmake. Mirrors ci.yml's `windows` job (clang-cl, Ninja, vcvars64 in ONE cmd
  # step) — the same toolchain CI already proves builds — but in the Release flavour for the shipped binary.
  # CODECORTEX_LTO=OFF on purpose: Release turns LTO on by default, and clang-cl + lld-link LTO has never been
  # exercised by any CI leg; the first Windows release ships the configuration CI has actually built. Turning LTO
  # on here is a follow-up once a CI leg proves it.
  #
  # The zip is laid out as an installed PREFIX (bin/ + share/codecortex/), not a flat folder: src/ui/server.cpp
  # resolves the dashboard at <exe>/../share/codecortex/ui, so a user can unzip anywhere and the dashboard works
  # with no install step and no CODECORTEX_UI_ASSETS variable.
  build-windows:
    name: build (windows-x64)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure and build (clang-cl, Ninja, Release, LTO off)
        shell: cmd
        run: |
          @echo on
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL ( echo release: no Visual Studio install with the x64 C++ tools & exit /b 1 )
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          set "RW_LLVM=%VSINSTALL%\VC\Tools\Llvm\x64\bin"
          if exist "C:\Program Files\LLVM\bin\clang-cl.exe" set "RW_LLVM=C:\Program Files\LLVM\bin"
          set "PATH=%RW_LLVM%;%PATH%"
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_BUILD_TYPE=Release -DCODECORTEX_LTO=OFF || exit /b 1
          cmake --build build -j --target codecortex || exit /b 1

      # Same shape checks ci.yml's windows job uses: real version string, real crawl, deterministic, well-formed,
      # and NOT an empty crawl (the failure class a Windows path bug produces).
      - name: Smoke-test the freshly built binary
        run: |
          ./build/codecortex.exe --version | tee version.txt
          grep -qE '^codecortex [0-9]+\.[0-9]+\.[0-9]+ \(' version.txt
          ./build/codecortex.exe test/fixture --no-cache > a.xml
          ./build/codecortex.exe test/fixture --no-cache > b.xml
          cmp a.xml b.xml
          python -c "import xml.etree.ElementTree as E,sys; E.parse(sys.argv[1])" a.xml
          files="$( grep -o '<f ' a.xml | wc -l )"
          test "$files" -ge 7 || { echo "release: windows fixture crawl indexed $files file(s), expected >= 7" >&2; exit 1; }

      - name: Package (zip, installed-prefix layout)
        id: package
        run: |
          releaseTag="${{ inputs.tag || github.ref_name }}"
          version="$( ./build/codecortex.exe --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1 )"
          if [ "v${version}" != "$releaseTag" ]; then
            echo "release: binary version v${version} does not match release tag ${releaseTag}" >&2
            exit 1
          fi
          asset="codecortex-${version}-windows-x64"
          root="dist/${asset}"
          mkdir -p "$root/bin" "$root/share/codecortex/skills"
          cp build/codecortex.exe "$root/bin/codecortex.exe"
          cp README.md "$root/"; cp LICENSE "$root/" 2>/dev/null || true
          cp -R ui "$root/share/codecortex/ui"
          cp -R skills/codecortex-* "$root/share/codecortex/skills/"
          cp -R hooks "$root/share/codecortex/hooks"
          # The dashboard must resolve from the unzipped layout exactly as server.cpp looks for it.
          test -f "$root/share/codecortex/ui/index.html"
          ( cd dist && 7z a -tzip "${asset}.zip" "${asset}" >/dev/null )
          ( cd dist && sha256sum "${asset}.zip" > "${asset}.zip.sha256" )
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"

      # One-click Claude Desktop extension: the file a non-technical user double-clicks. Claude's install dialog
      # asks for their project folder; no PATH, no JSON. See scripts/build_mcpb.py and packaging/mcpb/.
      - name: Claude Desktop extension (.mcpb)
        run: |
          python -m pip install --quiet jsonschema
          asset="${{ steps.package.outputs.asset }}"; root="dist/${asset}"
          version="${asset#codecortex-}"; version="${version%-windows-x64}"
          python scripts/build_mcpb.py --binary "$root/bin/codecortex.exe" --ui "$root/share/codecortex/ui" \
            --skills "$root/share/codecortex/skills" --hooks "$root/share/codecortex/hooks" \
            --version "$version" --platform win32 --out "dist/${asset}.mcpb" --manifest-out "$root"
          ( cd dist && sha256sum "${asset}.mcpb" > "${asset}.mcpb.sha256" )
          # The unzipped release folder is now ALSO an unpacked extension (manifest.json at its root, same
          # bin/ + share/ layout as the .mcpb): Claude → Settings → Extensions → Install unpacked extension.
          rm -f "dist/${asset}.zip" "dist/${asset}.zip.sha256"
          ( cd dist && 7z a -tzip "${asset}.zip" "${asset}" >/dev/null )
          ( cd dist && sha256sum "${asset}.zip" > "${asset}.zip.sha256" )

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.asset }}
          path: |
            dist/${{ steps.package.outputs.asset }}.zip
            dist/${{ steps.package.outputs.asset }}.zip.sha256
            dist/${{ steps.package.outputs.asset }}.mcpb
            dist/${{ steps.package.outputs.asset }}.mcpb.sha256
          if-no-files-found: error

  smoke-rhel:
    name: smoke RHEL 9 (${{ matrix.name }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
          - name: linux-arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    # ubi9 = RHEL 9 userland (glibc 2.34, libstdc++ GLIBCXX <= 3.4.29): exactly the environment the
    # pre-manylinux binaries died on. The packaged tarball must run here or publish is blocked.
    container: registry.access.redhat.com/ubi9/ubi
    steps:
      - uses: actions/checkout@v4

      - name: Install xmllint
        run: dnf install -y libxml2

      - uses: actions/download-artifact@v4
        with:
          pattern: "*-${{ matrix.name }}"
          path: dist
          merge-multiple: true

      - name: Run the packaged binary on RHEL 9
        run: |
          tar -xzf dist/*.tar.gz -C dist
          bin="$( find dist -type f -name codecortex )"
          "$bin" --version
          "$bin" test/fixture --no-cache | xmllint --noout -

  publish:
    name: publish GitHub Release
    needs: [build, build-windows, smoke-rhel]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List staged release assets
        run: ls -la dist

      # 2026-09-06 (stranger audit): v0.4.0 — the first release in 1,051 commits — went out with a body of one
      # compare link, while CHANGELOG.md carried a full section for it. The release page is the one page the
      # README's Release badge links to; it carries that section now, and the auto-generated notes ride
      # below it. A tag with no CHANGELOG section fails the job rather than publishing an empty page again.
      - name: Release notes from CHANGELOG.md
        run: |
          set -eu
          tag="${{ inputs.tag || github.ref_name }}"
          ver="${tag#v}"
          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" { on = 1; print; next }
            on && /^## \[/            { exit }
            on                         { print }
          ' CHANGELOG.md > dist/RELEASE_NOTES.md
          if [ ! -s dist/RELEASE_NOTES.md ]; then
            echo "CHANGELOG.md has no '## [$ver]' section — write it before tagging $tag" >&2
            exit 1
          fi
          wc -l dist/RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          body_path: dist/RELEASE_NOTES.md
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256
            dist/*.mcpb
            dist/*.mcpb.sha256
          generate_release_notes: true
